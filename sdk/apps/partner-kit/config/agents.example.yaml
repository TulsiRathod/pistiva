# Pistiva node configuration: which agent modules run, and where they read your data.
# Copy to config/agents.yaml and edit. Paths are relative to this file.
agent:
  name: Bharat Fasteners quote agent
  description: Quotes and draft orders from our own inventory

connectors:
  inventory:
    type: json-file            # json-file | csv-file | mcp
    path: ../data/inventory.json
  # erp:
  #   type: mcp                # any MCP server exposing a SKU lookup tool, run locally over stdio
  #   command: npx
  #   args: [tsx, examples/mcp-inventory-server.ts]
  #   tool: lookup_sku

# Task types this node answers. `module` picks the agent module; swap it to change behaviour.
provides:
  quote.request:
    module: inventory-quote
    connector: inventory
    options:
      priceFactorBps: 10000    # 10000 = list price
      currency: INR
  order.draft:
    module: order-draft
    options:
      holdDays: 3

# Task types operators may send from the Outbox.
requests:
  - quote.request
  - order.draft

outbound:
  currency: INR
  defaultBudget: "5000.00"
# Optional AI layer. Models only draft and ask; fixed rules and people decide.
ai:
  llm:
    provider: none             # anthropic | ollama | none
    # model: claude-opus-5-5   # anthropic: uses ANTHROPIC_API_KEY or an `ant auth login` profile
    # model: qwen2.5:7b-instruct  # ollama: everything stays on your machines
  preferences: Prefer the full quantity even if it ships later.
  rag:
    embedder: hash             # hash (no model) | ollama (nomic-embed-text)
  specCheck: false             # supplier side: ask before quoting items that conflict with a buyer's specs
