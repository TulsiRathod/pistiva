spring:
  application:
    name: pistiva-platform
  datasource:
    # DB_URL wins when set; otherwise the URL is built from parts (as hosting providers expose them).
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pistiva}}
    username: ${DB_USER:pistiva}
    password: ${DB_PASSWORD:pistiva}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  # Redis is opt-in (pistiva.redis.url); without it nothing tries to connect.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs

pistiva:
  issuer: pistiva-platform
  signing-key-seed: ${PISTIVA_SIGNING_KEY_SEED:}
  signing-key-file: ${PISTIVA_SIGNING_KEY_FILE:./data/platform-signing-key}
  grant-ttl: 5m
  user-token-ttl: 8h
  agent-assertion-max-ttl: 2m
  admin-email: ${PISTIVA_ADMIN_EMAIL:admin@pistiva.local}
  admin-password: ${PISTIVA_ADMIN_PASSWORD:change-me-admin}
  cors-origins: ${PISTIVA_CORS_ORIGINS:http://localhost:5173}
  redis:
    url: ${PISTIVA_REDIS_URL:}
  certification:
    # When true, discovery hides uncertified agents and grants to them are refused (certifiers excepted).
    required: ${PISTIVA_CERTIFICATION_REQUIRED:false}
    validity: 365d
