spring:
  application:
    name: pistiva-platform
  datasource:
    # DB_URL wins when set; otherwise the URL is built from parts (as hosting providers expose them).
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pistiva}}
    username: ${DB_USER:pistiva}
    password: ${DB_PASSWORD:pistiva}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  # Redis is opt-in (pistiva.redis.url); without it nothing tries to connect.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: ${PISTIVA_TRACE_SAMPLING:1.0}
  observations:
    key-values:
      service: pistiva-platform

springdoc:
  api-docs:
    path: /v3/api-docs

pistiva:
  issuer: pistiva-platform
  signing-key-seed: ${PISTIVA_SIGNING_KEY_SEED:}
  signing-key-file: ${PISTIVA_SIGNING_KEY_FILE:./data/platform-signing-key}
  # Where the signing key lives: local (the seed or file above) or vault-transit (Vault / OpenBao, HSM-backed if configured).
  signing:
    provider: ${PISTIVA_SIGNING_PROVIDER:local}
    vault:
      address: ${VAULT_ADDR:}
      token: ${VAULT_TOKEN:}
      mount: ${PISTIVA_VAULT_TRANSIT_MOUNT:transit}
      key: ${PISTIVA_VAULT_TRANSIT_KEY:pistiva-platform}
  grant-ttl: 5m
  user-token-ttl: 8h
  agent-assertion-max-ttl: 2m
  admin-email: ${PISTIVA_ADMIN_EMAIL:admin@pistiva.local}
  admin-password: ${PISTIVA_ADMIN_PASSWORD:change-me-admin}
  cors-origins: ${PISTIVA_CORS_ORIGINS:http://localhost:5173}
  redis:
    url: ${PISTIVA_REDIS_URL:}
  # Bearer token a Prometheus scraper sends to /actuator/prometheus; the endpoint is closed without one.
  metrics:
    token: ${PISTIVA_METRICS_TOKEN:}
  billing:
    # Share of each provider's per-task revenue the network keeps; the rest is paid out monthly.
    platform-fee-percent: ${PISTIVA_PLATFORM_FEE_PERCENT:10}
  certification:
    # When true, discovery hides uncertified agents and grants to them are refused (certifiers excepted).
    required: ${PISTIVA_CERTIFICATION_REQUIRED:false}
    validity: 365d
    # Grants the platform must have issued to the agent since the suite started, or the report is refused.
    min-probe-grants: 5
  p2p:
    # WebRTC between agents: STUN for NAT discovery, TURN (coturn with use-auth-secret) as the relay fallback.
    stun-urls: ${PISTIVA_STUN_URLS:}
    turn-urls: ${PISTIVA_TURN_URLS:}
    turn-secret: ${PISTIVA_TURN_SECRET:}
