# Metrics and traces for the local stack, layered over docker-compose.yml:
#   docker compose -f infra/docker-compose.yml -f infra/observability.yml up --build
# Grafana http://localhost:3000 (admin / admin) has the "Pistiva network" dashboard.
# Prometheus http://localhost:9090 · Jaeger (traces) http://localhost:16686
# Partner Kit nodes started with `npm run nodes` on the host are scraped too (ports 9301, 9302).
services:
  platform:
    environment:
      PISTIVA_METRICS_TOKEN: local-metrics-token
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces

  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.1
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: system
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4318:4318"
