name: CI

on:
  push:
  pull_request:

jobs:
  platform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Includes the Testcontainers flow tests; GitHub-hosted runners have Docker.
      - run: mvn -B verify

  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Includes the Partner Kit integration tests (Testcontainers Postgres).
      - run: npm test
      - run: npm run build:web -w @pistiva/partner-kit
      - run: npm run eval -- --self-test
      # Evaluates the real model only when the repository has an Anthropic key configured.
      - if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: npm run eval
        env:
          PISTIVA_LLM: anthropic
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [platform, sdk]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/docker-compose.yml up -d --build --wait postgres platform
      - run: docker compose -f infra/docker-compose.yml run --rm demo
      - if: failure()
        run: docker compose -f infra/docker-compose.yml logs platform
